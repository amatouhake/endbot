name: Patched Endstone validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "endstone.lock"
      - "patches/endstone/**"
      - "plugin/endbot/**"
      - "scripts/prepare_endstone.py"
      - "scripts/build_endstone_wheel.py"
      - "scripts/inspect_linux_wheel.py"
      - "scripts/test_package_install.py"
      - "tests/test_endstone_contract.py"
      - "tests/test_release_contract.py"
      - ".github/workflows/full-validation.yml"
  push:
    branches: [main]
    paths:
      - "endstone.lock"
      - "patches/endstone/**"
      - "plugin/endbot/**"
      - "scripts/prepare_endstone.py"
      - "scripts/build_endstone_wheel.py"
      - "scripts/inspect_linux_wheel.py"
      - "scripts/test_package_install.py"
      - "tests/test_endstone_contract.py"
      - "tests/test_release_contract.py"
      - ".github/workflows/full-validation.yml"

permissions:
  contents: read

concurrency:
  group: endstone-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore validated Endstone wheel
        id: endstone-wheel-cache
        uses: actions/cache/restore@v6
        with:
          path: dist/endstone/
          key: endstone-wheel-v1-linux-x64-cpy312-llvm20-cibw3.4.1-${{ hashFiles('endstone.lock', 'patches/endstone/**', 'scripts/prepare_endstone.py', 'scripts/build_endstone_wheel.py', '.github/workflows/full-validation.yml') }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install LLVM 20 and libc++
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: "20"
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q build-essential lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y -q libc++-20-dev libc++abi-20-dev clang-tools-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200
          sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld-20 100

      - name: Install build tools
        run: python -m pip install --upgrade build cibuildwheel==3.4.1 conan hatchling ninja packaging uv

      - name: Run Endbot tests
        env:
          PYTHONPATH: plugin/endbot/src
        run: |
          python scripts/check_portability.py
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugin/endbot/tests -v
          npm ci --prefix runtime
          npm run check --prefix runtime
          npm test --prefix runtime

      - name: Prepare patched Endstone
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_endstone.py

      - name: Resolve patched Endstone dependencies
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        working-directory: build/endstone-patched
        run: conan install . --build=missing

      - name: Build patched Endstone
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        working-directory: build/endstone-patched
        run: |
          . build/RelWithDebInfo/generators/conanbuild.sh
          cmake --preset conan-relwithdebinfo -DENDSTONE_GENERATE_STUBS=OFF
          cmake --build --preset conan-relwithdebinfo

      - name: Run patched Endstone tests
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        working-directory: build/endstone-patched
        run: ctest --preset conan-relwithdebinfo --output-on-failure

      - name: Build repaired Endstone wheel
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/build_endstone_wheel.py \
            --output-dir dist/endstone

      - name: Inspect repaired Endstone wheel
        run: |
          uv run --with auditwheel==6.2.0 \
            python scripts/inspect_linux_wheel.py dist/endstone/endstone-*.whl

      - name: Build plugin and test paired installation
        run: |
          python -m build --wheel --outdir dist/plugin plugin/endbot
          python scripts/test_package_install.py \
            --endstone-wheel-dir dist/endstone \
            --plugin-wheel-dir dist/plugin

      - name: Test in a clean Linux consumer without LLVM
        run: >-
          docker run --rm
          --volume "${PWD}:/workspace:ro"
          --workdir /workspace
          python:3.12-slim-bookworm
          python scripts/test_package_install.py
          --endstone-wheel-dir dist/endstone
          --plugin-wheel-dir dist/plugin

      - name: Save validated Endstone wheel
        if: steps.endstone-wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist/endstone/
          key: endstone-wheel-v1-linux-x64-cpy312-llvm20-cibw3.4.1-${{ hashFiles('endstone.lock', 'patches/endstone/**', 'scripts/prepare_endstone.py', 'scripts/build_endstone_wheel.py', '.github/workflows/full-validation.yml') }}
