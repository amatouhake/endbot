[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "endbot-core"
version = "0.5.0"
description = "Shared, Endstone-free logic for Endbot"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "amatouhake and Endbot contributors" }]
dependencies = ["tomli>=2; python_version < \"3.11\""]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/endbot_core", "src/endbotd"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "E", "F"]
