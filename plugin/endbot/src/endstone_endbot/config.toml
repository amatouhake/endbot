[authorization]
# Xbox GamerTags allowed to control Bots. Each binds to that player's XUID on
# its first Xbox-authenticated join; afterwards only the XUID grants control.
# `endbot start` generates this from endbot.toml [controllers].gamertags.
controller-gamertags = []
# Binding state; relative paths resolve from the Endbot plugin data directory.
controllers-file = "controllers.json"
# Runtime add/remove overrides; only the plugin writes this file.
controller-policy-file = "controller-policy.json"
# Managed instances generate an absolute directory for correlated CLI results.
# controller-requests-directory = "controller-requests"
# Pre-bound identities (rc.1 style). Values are strings. Empty lists and no
# GamerTags grant no player the control permission.
allowed-uuids = []
allowed-xuids = []

[runtime]
# The runtime creates this shared secret. Relative paths are resolved from the
# Endbot plugin data directory. Keep the file outside source control.
token-file = "control.token"
host = "127.0.0.1"
port = 19142
# Covers the bounded 5-second session close plus the default 1-second
# replacement delay. Keep this above the runtime's controlRequestTimeoutMs.
timeout-seconds = 10.0
# Read all 36 Bot inventory slots plus offhand/armor at this interval (1..1200).
# Keep the hotbar-sync-* names for existing installations.
hotbar-sync-interval-ticks = 4
# Resend unchanged state for rejected/predicted actions (1..72000).
# Resends occur at a read; effective spacing rounds up to a read interval.
hotbar-sync-resend-ticks = 20

[ui]
# Language of player-facing replies, help and forms: "auto" follows each
# player's game language (Japanese clients get Japanese, others English),
# "en" or "ja" fixes it for everyone. Command words, the server console and
# logs stay English.
language = "auto"
