name: Fast CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development checks
        run: python -m pip install --upgrade build hatchling ruff

      - name: Check repository portability
        run: python scripts/check_portability.py

      - name: Lint Python
        run: ruff check scripts tests plugin/endbot

      - name: Test safety preflight
        run: |
          python -m unittest discover -s tests -v
          python scripts/preflight.py tests/fixtures/server-safe.properties --acknowledge-world-state-unverified
          if python scripts/preflight.py tests/fixtures/server-unsafe.properties --acknowledge-world-state-unverified; then
            echo "unsafe fixture unexpectedly passed"
            exit 1
          fi

      - name: Test and build plugin
        env:
          PYTHONPATH: plugin/endbot/src
        run: |
          python -m unittest discover -s plugin/endbot/tests -v
          python -m build --wheel --outdir dist/plugin plugin/endbot

      - name: Test runtime
        run: |
          npm run check --prefix runtime
          npm test --prefix runtime

      - name: Apply Endstone patch series to exact pin
        run: >-
          python scripts/prepare_endstone.py
          --cache "${{ runner.temp }}/endstone.git"
          --output "${{ runner.temp }}/endstone-patched"

