[endbotd]
# The plugin dials endbotd over loopback and holds no policy or store
# (docs/ENDBOTD.md). `endbot start` generates this table; a manual install runs
# `python -m endbotd --config endbotd.toml` itself and points it here.
host = "127.0.0.1"
port = 19143
# endbotd's link secret. Relative paths are resolved from the Endbot plugin data
# directory. Keep the file outside source control.
token-file = "endbotd.token"
