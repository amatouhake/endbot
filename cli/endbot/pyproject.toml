[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "endbot"
version = "0.1.0"
description = "Operator CLI for Endbot"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "amatouhake and Endbot contributors" }]
dependencies = [
  "cryptography>=41",
  "tomli>=2; python_version < \"3.11\"",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
endbot = "endbot_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endbot_cli"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "E", "F"]
