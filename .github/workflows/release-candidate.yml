name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Endbot candidate version (no publication occurs)
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install LLVM 20 and libc++
        env:
          LLVM_VERSION: "20"
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q build-essential lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y -q libc++-20-dev libc++abi-20-dev clang-tools-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200
          sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld-20 100

      - name: Install packaging tools
        run: python -m pip install --upgrade build cibuildwheel==3.4.1 conan hatchling ninja packaging uv

      - name: Verify source and prepare Endstone
        env:
          PYTHONPATH: plugin/endbot/src
        run: |
          python scripts/check_portability.py
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugin/endbot/tests -v
          npm ci --prefix runtime
          npm run check --prefix runtime
          npm test --prefix runtime
          python scripts/prepare_endstone.py

      - name: Build and test patched Endstone
        working-directory: build/endstone-patched
        run: |
          conan install . --build=missing
          . build/RelWithDebInfo/generators/conanbuild.sh
          cmake --preset conan-relwithdebinfo -DENDSTONE_GENERATE_STUBS=OFF
          cmake --build --preset conan-relwithdebinfo
          ctest --preset conan-relwithdebinfo --output-on-failure

      - name: Build, inspect, and test the Linux wheel
        run: |
          python scripts/build_endstone_wheel.py \
            --output-dir dist/endstone
          uv run --with auditwheel==6.2.0 \
            python scripts/inspect_linux_wheel.py dist/endstone/endstone-*.whl
          python -m build --wheel --outdir dist/plugin plugin/endbot
          python -m build --wheel --outdir dist/cli cli/endbot
          python scripts/test_package_install.py --endstone-wheel-dir dist/endstone --plugin-wheel-dir dist/plugin
          mkdir -p staging/linux
          cp dist/endstone/*.whl staging/linux/
          cp build/endstone-patched/LICENSE staging/linux/ENDSTONE_LICENSE

      - name: Build the Linux operator bundle
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/build_bundle.py \
            --version "$CANDIDATE_VERSION" \
            --platform linux-x86_64 \
            --endstone-wheel dist/endstone/endstone-*.whl \
            --plugin-wheel dist/plugin/endstone_endbot-*.whl \
            --cli-wheel dist/cli/endbot-*.whl \
            --endstone-license staging/linux/ENDSTONE_LICENSE \
            --output-dir dist/bundle

      - name: Test candidate in a clean Linux consumer without LLVM
        run: >-
          docker run --rm
          --volume "${PWD}:/workspace:ro"
          --workdir /workspace
          python:3.12-slim-bookworm
          python scripts/test_package_install.py
          --endstone-wheel-dir dist/endstone
          --plugin-wheel-dir dist/plugin

      - name: Upload Linux wheel (intermediate, not the candidate)
        uses: actions/upload-artifact@v4
        with:
          name: endstone-linux-wheel
          path: staging/linux/
          if-no-files-found: error

      - name: Upload Linux bundle and pure wheels (intermediate, not the candidate)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: |
            dist/bundle/
            dist/plugin/
            dist/cli/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Mirror upstream Endstone's own Windows wheel toolchain
      # (prepared tree .github/workflows/build.yml): MSVC developer
      # environment plus CMake/Ninja, with Conan available to the
      # PEP 517 build backend. Deliberately no SENTRY_AUTH_TOKEN or
      # other secrets: without a token the repair step skips symbol
      # upload and only stages the wheel.
      - name: Set up MSVC (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install packaging tools
        run: python -m pip install --upgrade build cibuildwheel==3.4.1 conan packaging

      - name: Verify source and prepare Endstone
        env:
          PYTHONPATH: plugin/endbot/src
        run: |
          python scripts/check_portability.py
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugin/endbot/tests -v
          python scripts/prepare_endstone.py

      - name: Build, inspect, and test the Windows wheel
        run: |
          python scripts/build_endstone_wheel.py \
            --output-dir dist/endstone \
            --build-selector cp312-win_amd64
          python scripts/inspect_windows_wheel.py dist/endstone/endstone-*.whl
          python -m build --wheel --outdir dist/plugin plugin/endbot
          python -m build --wheel --outdir dist/cli cli/endbot
          python scripts/test_package_install.py --endstone-wheel-dir dist/endstone --plugin-wheel-dir dist/plugin
          mkdir -p staging/windows
          cp dist/endstone/*.whl staging/windows/
          cp build/endstone-patched/LICENSE staging/windows/ENDSTONE_LICENSE

      - name: Build the Windows operator bundle
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/build_bundle.py \
            --version "$CANDIDATE_VERSION" \
            --platform windows-x86_64 \
            --endstone-wheel dist/endstone/endstone-*.whl \
            --plugin-wheel dist/plugin/endstone_endbot-*.whl \
            --cli-wheel dist/cli/endbot-*.whl \
            --endstone-license staging/windows/ENDSTONE_LICENSE \
            --output-dir dist/bundle

      - name: Upload Windows wheel (intermediate, not the candidate)
        uses: actions/upload-artifact@v4
        with:
          name: endstone-windows-wheel
          path: staging/windows/
          if-no-files-found: error

      - name: Upload Windows bundle (intermediate, not the candidate)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: dist/bundle/
          if-no-files-found: error

  assemble:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade packaging

      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: endstone-linux-wheel
          path: staging/linux

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: endstone-windows-wheel
          path: staging/windows

      - name: Download Linux bundle and pure wheels
        uses: actions/download-artifact@v4
        with:
          name: bundle-linux
          path: staging/bundle-linux

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-windows
          path: staging/bundle-windows

      # upload-artifact strips the paths' common ancestor (dist/), so the
      # bundle-linux artifact holds bundle/, plugin/ and cli/ at its root.
      # The pure-Python plugin and CLI wheels are built in each platform job
      # from the same commit; assemble publishes exactly one of each, taking
      # the Linux-built pair so the candidate checksums are unambiguous. The
      # runtime/config tarballs are built once, here. Both Endstone wheels
      # arrive install-tested from the platform jobs; the Linux wheel is
      # re-verified here against the published plugin wheel. Both operator
      # bundles arrive self-tested from their platform jobs and join dist/
      # so SHA256SUMS covers them.
      - name: Assemble candidate artifacts
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$CANDIDATE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]; then
            echo "candidate version contains unsupported characters"
            exit 1
          fi
          python scripts/check_release_version.py "$CANDIDATE_VERSION"
          mkdir -p dist
          cp staging/linux/*.whl staging/windows/*.whl dist/
          cp staging/linux/ENDSTONE_LICENSE dist/ENDSTONE_LICENSE
          cp staging/bundle-linux/plugin/*.whl staging/bundle-linux/cli/*.whl dist/
          python scripts/test_package_install.py --endstone-wheel-dir staging/linux --plugin-wheel-dir staging/bundle-linux/plugin
          cp staging/bundle-linux/bundle/* staging/bundle-windows/* dist/
          tar -czf "dist/endbot-runtime-${CANDIDATE_VERSION}.tar.gz" \
            -C runtime package.json package-lock.json README.md endbot-runtime.example.json scripts src
          tar -czf "dist/endbot-config-${CANDIDATE_VERSION}.tar.gz" config LICENSE THIRD_PARTY_NOTICES.md
          python scripts/generate_compatibility_manifest.py dist/compatibility-manifest.json --endbot-version "$CANDIDATE_VERSION"
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Upload candidate (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: endbot-${{ inputs.version }}-candidate
          path: dist/
          if-no-files-found: error
