[authorization]
# Xbox GamerTags allowed to control Bots. Each binds to that player's XUID on
# its first Xbox-authenticated join; afterwards only the XUID grants control.
# `endbot start` generates this from endbot.toml [controllers].gamertags.
controller-gamertags = []
# Binding state; relative paths resolve from the Endbot plugin data directory.
controllers-file = "controllers.json"
# Runtime add/remove overrides; only the plugin writes this file.
controller-policy-file = "controller-policy.json"
# Managed instances generate an absolute directory for correlated CLI results.
# controller-requests-directory = "controller-requests"
# Pre-bound identities (rc.1 style). Values are strings. Empty lists and no
# GamerTags grant no player the control permission.
allowed-uuids = []
allowed-xuids = []

[runtime]
# The runtime creates this shared secret. Relative paths are resolved from the
# Endbot plugin data directory. Keep the file outside source control.
token-file = "control.token"
host = "127.0.0.1"
port = 19142
# Covers the bounded 5-second session close plus the default 1-second
# replacement delay. Keep this above the runtime's controlRequestTimeoutMs.
timeout-seconds = 10.0
# Read all 36 Bot inventory slots plus offhand/armor at this interval (1..1200).
# Keep the hotbar-sync-* names for existing installations.
hotbar-sync-interval-ticks = 4
# Resend unchanged state for rejected/predicted actions (1..72000).
# Resends occur at a read; effective spacing rounds up to a read interval.
hotbar-sync-resend-ticks = 20

[ui]
# Language of player-facing replies, help and forms: "auto" follows each
# player's game language (Japanese clients get Japanese, others English),
# "en" or "ja" fixes it for everyone. Command words, the server console and
# logs stay English.
language = "auto"

[scripting]
# Applied at startup. Stored source is retained when disabled.
enabled = false
# Empty uses the plugin bundle's runner/endbot-luau-runner[.exe]. A relative
# configured path resolves inside the plugin data folder. Install api.luau
# beside the executable (node runner/build.mjs does this for development).
runner = ""
controller-runs = 2
server-runs = 8
# Total run lifetime in wall seconds; 0 disables the total deadline.
# Per-slice VM, memory, operation rate and concurrency limits still apply.
wall-seconds = 0
slice-ms = 100
interrupt-budget = 1000000
operations-per-second = 20
max-script-bytes = 32768
max-scripts = 64
memory-bytes = 33554432
# OS resource limits, applied before sending script data. Setup failure rejects
# the run. Explicit false opts out of ALL OS limits below, not the VM limits.
os-confinement = true
# Committed bytes on Windows, address space on Linux. 0 disables this cap.
# A nonzero value must be >= memory-bytes + 67108864 (64 MiB native headroom).
process-memory-bytes = 268435456
# Cumulative CPU seconds per run (Windows user time, Linux user + system time).
# 0 disables this cap; waits do not consume CPU time. Priority is also lowered.
# This is the cap that stops a run stuck inside one C library call (string.rep,
# string.gsub, table.sort), which the VM's per-slice budget cannot interrupt.
cpu-seconds = 60
# Windows: one-process Job Object, kill on job close/parent exit.
# Linux: SIGKILL on parent/creator-thread death. No per-run child-process ban;
# RLIMIT_NPROC would affect the whole UID. The trusted runner never spawns.
